<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d2b4e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Playa+" />
  <meta name="description" content="Beach delivery – drinks, ice cream & snacks delivered to your spot." />
  <title>Playa+ | We Bring It To You</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:   #0d2b4e;
      --teal:   #2ab5a5;
      --teal2:  #3ecfbf;
      --orange: #f47c3c;
      --sun:    #f5a623;
      --sand:   #f5ede0;
      --cream:  #faf6f1;
      --white:  #ffffff;
      --border: rgba(0,0,0,0.09);
      --muted:  #718096;
      --green:  #22c55e;
    }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #e8e8e8;
      color: var(--navy);
      -webkit-font-smoothing: antialiased;
    }
    #app {
      max-width: 430px;
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--cream);
      position: relative;
      overflow-x: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,0.15);
    }
    button { font-family: inherit; }
    input, textarea { font-family: inherit; outline: none; }
    input:focus, textarea:focus { border-color: var(--teal) !important; }
    ::-webkit-scrollbar { width: 0; }
    .screen { min-height: 100dvh; display: flex; flex-direction: column; }
    .content { flex: 1; overflow-y: auto; padding-bottom: 80px; }
    .sticky-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      background: var(--white);
      border-top: 0.5px solid var(--border);
      display: flex;
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-btn {
      flex: 1; padding: 8px 4px 6px; border: none; background: transparent;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
      transition: background 0.15s;
    }
    .nav-btn.active { background: #f0faf9; }
    .nav-btn span.icon { font-size: 20px; }
    .nav-btn span.label { font-size: 10px; font-weight: 400; color: var(--muted); }
    .nav-btn.active span.label { color: var(--teal); font-weight: 600; }
    .header {
      background: var(--navy);
      padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .card {
      background: var(--white);
      border: 0.5px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .section-label {
      font-size: 11px; font-weight: 600; color: var(--teal);
      letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 10px;
    }
    .btn-primary {
      width: 100%; padding: 15px;
      background: var(--orange); color: var(--white);
      border: none; border-radius: 12px;
      font-size: 16px; font-weight: 600; cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-primary:active { opacity: 0.85; }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
    .badge {
      font-size: 11px; font-weight: 600; padding: 3px 10px;
      border-radius: 20px;
    }
    .badge-preparing { background: #fff8e6; color: #b45309; }
    .badge-delivered { background: #e6f7f5; color: #0d6e63; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 36px; height: 36px; border: 3px solid rgba(42,181,165,0.2);
      border-top-color: var(--teal); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    .fade-in { animation: fadeIn 0.25s ease both; }
  </style>
</head>
<body>
<div id="app"></div>

<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
const SHEET_CSV  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ5bYbVSWwewbH3NJwwXuN4uplRqtQuwdc0bD0QbVvf6_iU6sj6gEzLJ3qO3vXVuir0x2hpFDyY5WGY/pub?gid=0&single=true&output=csv';
const CONFIG_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ5bYbVSWwewbH3NJwwXuN4uplRqtQuwdc0bD0QbVvf6_iU6sj6gEzLJ3qO3vXVuir0x2hpFDyY5WGY/pub?gid=611850101&single=true&output=csv';
const ORDERS_KEY = 'playa_orders_v1';

// Live config values (loaded from Config sheet)
let CONFIG = { service_fee: 4.99, fee_label: 'Service fee', delivery_fee: 0, delivery_label: 'Delivery', store_status: 'open', store_message: 'Store not open at this moment' };

// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const CAT_EMOJI   = { Drinks:'💧', Snacks:'🥨', Food:'🥗', 'Ice Cream':'🍦' };
const CAT_ORDER   = ['Drinks','Food','Snacks','Ice Cream'];
const PROD_EMOJI  = {
  DRK001:'🥤',DRK002:'🥤',DRK003:'🥤',DRK004:'🟢',DRK005:'🟢',
  DRK006:'💧',DRK007:'✨',DRK008:'⚡',DRK009:'🍊',DRK010:'🍋',
  SNK001:'🥔',SNK002:'🌽',SNK003:'💪',SNK004:'🌾',SNK005:'🧀',
  FD001:'🥗',FD002:'🐟',FD003:'🍤',
  ICE001:'🍓',ICE002:'🍉',ICE003:'💚',ICE004:'🥥',ICE005:'🍍',ICE006:'🍊'
};

// ─── STATE ───────────────────────────────────────────────────────────────────
const CART_KEY = 'playa_cart_v1';
const VIEW_KEY  = 'playa_view_v1';
const SAFE_VIEWS = ['home','menu','cart','track','profile','history','support','suggestions','success'];

let PRODUCTS = [];
let S = {
  view: 'loading',
  cart: JSON.parse(localStorage.getItem(CART_KEY) || '{}'),
  orders: JSON.parse(localStorage.getItem(ORDERS_KEY) || '[]'),
  catFilter: 'All',
  pinPlaced: false, pinX: 55, pinY: 65,
  gpsLat: null, gpsLng: null, gpsAcc: null,
  selfieData: null,
  idMethod: 'selfie',
  spotNote: '',
  orderPlaced: null,
  adminView: 'dashboard',
  supportSent: false,
  supportMsg: '',
  suggestionSent: false,
  suggestionText: ''
};
function save() { localStorage.setItem(ORDERS_KEY, JSON.stringify(S.orders)); }
function saveCart() {
  localStorage.setItem(CART_KEY, JSON.stringify(S.cart));
  if (SAFE_VIEWS.includes(S.view)) localStorage.setItem(VIEW_KEY, S.view);
}
function cartCount() { return Object.values(S.cart).reduce((a,b)=>a+b,0); }
function inCart(sku) { return S.cart[sku] || 0; }
function stockLeft(p) { return (p.inventory ?? 999) - inCart(p.sku); }
function isOutOfStock(p) { return stockLeft(p) <= 0; }
function cartSubtotal() {
  return Object.entries(S.cart).reduce((sum,[sku,qty]) => {
    const p = PRODUCTS.find(x=>x.sku===sku);
    return sum + (p ? p.price*qty : 0);
  }, 0);
}
function cartTotal() {
  // grandTotal = subtotal + service fee + delivery fee (when cart has items)
  const sub = cartSubtotal();
  return sub > 0 ? sub + (CONFIG.service_fee || 0) + (CONFIG.delivery_fee || 0) : 0;
}
function feeDisplay(amount, label) {
  // Shared helper: shows "Free 🎉" when zero, otherwise "$X.XX"
  return amount > 0
    ? `$${amount.toFixed(2)}`
    : `<span style="color:var(--green);font-weight:600">Free 🎉</span>`;
}

// ─── CSV PARSER ──────────────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
  return lines.slice(1).map(line => {
    const cols=[]; let cur='', inQ=false;
    for (let c of line) {
      if (c==='"') { inQ=!inQ; }
      else if (c===',' && !inQ) { cols.push(cur); cur=''; }
      else cur+=c;
    }
    cols.push(cur);
    const obj={};
    headers.forEach((h,i)=>{ obj[h]=(cols[i]||'').trim().replace(/^"|"$/g,''); });
    return obj;
  });
}

async function loadConfig() {
  try {
    const r = await fetch(CONFIG_CSV);
    const text = await r.text();
    const rows = parseCSV(text);
    rows.forEach(row => {
      const key = (row['Key'] || '').trim().toLowerCase();
      const val = (row['Value'] || '').trim();
      if (key === 'service_fee')   CONFIG.service_fee   = parseFloat(val) || 0;
      if (key === 'fee_label')     CONFIG.fee_label     = val || 'Service fee';
      if (key === 'delivery_fee')    CONFIG.delivery_fee    = parseFloat(val) || 0;
      if (key === 'delivery_label')  CONFIG.delivery_label  = val || 'Delivery';
      if (key === 'store_status')    CONFIG.store_status    = val.toLowerCase() || 'open';
      if (key === 'store_message')   CONFIG.store_message   = val || 'Store not open at this moment';
    });
  } catch(e) {
    console.warn('Config sheet unavailable, using defaults.');
  }
}

async function loadProducts() {
  try {
    await loadConfig(); // load fee before rendering anything
    const r = await fetch(SHEET_CSV);
    const text = await r.text();
    const rows = parseCSV(text);
    PRODUCTS = rows
      .filter(r => {
        const active = (r['Active'] || '').trim().toLowerCase();
        return active === 'yes' || active === 'active';
      })
      .map(r => ({
        sku:       r['SKU'],
        name:      r['Product Name'],
        desc:      r['Description'],
        cat:       r['Category'],
        img:       r['Product Image URL'] || '',
        price:     parseFloat(r['Selling Price ($)']) || 0,
        emoji:     PROD_EMOJI[r['SKU']] || CAT_EMOJI[r['Category']] || '🏖️',
        inventory: parseInt(r['Inventory'] || r['inventory'] || '999', 10),
      }));
    // Restore last view the user was on (cart, menu, etc.)
    // Never overwrite success screen — customer must choose to navigate away
    if (S.view !== 'success') {
      if (CONFIG.store_status !== 'open') {
        // Store is closed — show standby screen regardless of saved view
        S.view = 'standby';
      } else {
        const savedView = localStorage.getItem(VIEW_KEY);
        S.view = (savedView && SAFE_VIEWS.includes(savedView)) ? savedView : 'home';
      }
    }
  } catch(e) {
    S.view = 'error';
  }
  render();
}

// ─── SVG ASSETS ──────────────────────────────────────────────────────────────
function towerSVG(s=60) {
  return `<svg width="${s}" height="${s}" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <circle cx="42" cy="46" r="34" fill="#f5a623"/>
    <path d="M10 80 Q30 68 50 72 Q70 76 100 68 Q115 82 120 90 L0 90Z" fill="#2ab5a5" opacity="0.7"/>
    <path d="M0 84 Q25 74 55 78 Q80 82 120 74 L120 95 L0 95Z" fill="#3ecfbf" opacity="0.5"/>
    <rect x="46" y="32" width="32" height="24" rx="2" fill="#0d2b4e"/>
    <rect x="50" y="36" width="8" height="8" rx="1" fill="#fff" opacity="0.9"/>
    <rect x="62" y="36" width="8" height="8" rx="1" fill="#fff" opacity="0.9"/>
    <rect x="44" y="54" width="36" height="3" rx="1" fill="#0d2b4e"/>
    <rect x="42" y="56" width="4" height="22" rx="1" fill="#0d2b4e"/>
    <rect x="74" y="56" width="4" height="22" rx="1" fill="#0d2b4e"/>
    <line x1="46" y1="58" x2="60" y2="78" stroke="#0d2b4e" stroke-width="2"/>
    <line x1="74" y1="58" x2="60" y2="78" stroke="#0d2b4e" stroke-width="2"/>
    <line x1="46" y1="68" x2="74" y2="68" stroke="#0d2b4e" stroke-width="1.5"/>
    <rect x="57" y="20" width="2" height="12" rx="1" fill="#0d2b4e"/>
    <path d="M59 21 L67 24 L59 28Z" fill="#0d2b4e"/>
    <ellipse cx="25" cy="86" rx="18" ry="5" fill="#e8d5b7" opacity="0.6"/>
    <ellipse cx="90" cy="82" rx="14" ry="4" fill="#e8d5b7" opacity="0.5"/>
  </svg>`;
}

// ─── SHARED COMPONENTS ───────────────────────────────────────────────────────
function brandHeader(showCart=false) {
  return `<div class="header">
    <div style="display:flex;align-items:center;gap:10px">
      <img src="https://github.com/lolivalves/playa/blob/main/taff-04_white.png?raw=true" style="height:34px;object-fit:contain" alt="Playa+">
    </div>
    ${showCart ? `<button onclick="nav('cart')" style="background:rgba(255,255,255,0.15);border:none;border-radius:20px;padding:7px 14px;color:#fff;cursor:pointer;font-size:13px;font-family:inherit">
      ${cartCount()>0 ? `🛒 ${cartCount()} · $${cartSubtotal().toFixed(2)}` : '🛒 Cart'}
    </button>` : ''}
  </div>`;
}

function backHeader(title, backTo) {
  return `<div class="header">
    <div style="display:flex;align-items:center;gap:8px">
      <button onclick="nav('${backTo}')" style="background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:0 6px 0 0;line-height:1">←</button>
      <span style="color:#fff;font-size:16px;font-weight:500">${title}</span>
    </div>
  </div>`;
}

function bottomNav(active) {
  const tabs = [
    {id:'home', icon:'🏠', label:'Home'},
    {id:'menu', icon:'🍽️', label:'Menu'},
    {id:'track', icon:'🚀', label:'Track'},
    {id:'profile', icon:'👤', label:'Profile'}
  ];
  return `<nav class="sticky-nav">
    ${tabs.map(t=>`
      <button class="nav-btn ${active===t.id?'active':''}" onclick="nav('${t.id}')">
        <span class="icon">${t.icon}</span>
        <span class="label">${t.label}</span>
      </button>
    `).join('')}
  </nav>`;
}

// ─── SCREENS ─────────────────────────────────────────────────────────────────
function screenStandby() {
  return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:40px 32px;background:var(--navy);text-align:center">
    <img src="https://raw.githubusercontent.com/lolivalves/playa/main/taff-01.png" style="width:200px;height:200px;object-fit:contain;margin-bottom:40px" alt="Playa+">
    <div style="color:rgba(255,255,255,0.55);font-size:15px;font-weight:400;line-height:1.6;max-width:260px">
      ${CONFIG.store_message}
    </div>
  </div>`;
}

function screenLoading() {
  return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;gap:20px">
    <img src="https://raw.githubusercontent.com/lolivalves/playa/main/taff-01.png" style="width:90px;height:90px;object-fit:contain" alt="Playa+">
    <div style="font-size:22px;font-weight:700;color:#0d2b4e">playa<span style="color:#f47c3c">+</span></div>
    <div class="spinner"></div>
    <div style="color:#718096;font-size:13px">Loading your beach menu…</div>
  </div>`;
}

function screenError() {
  return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;gap:14px;padding:24px;text-align:center">
    <div style="font-size:48px">😕</div>
    <div style="font-weight:700;font-size:18px">Couldn't load the menu</div>
    <div style="color:#718096;font-size:14px">Check your connection and try again.</div>
    <button class="btn-primary" style="max-width:200px" onclick="location.reload()">Retry</button>
  </div>`;
}

function screenHome() {
  return `${brandHeader()}
  <div class="content fade-in">
    <div style="background:#0d2b4e;padding:8px 0 32px">
      <div style="display:flex;justify-content:center;padding:16px 0 8px"><img src="https://raw.githubusercontent.com/lolivalves/playa/main/taff-01.png" style="width:160px;height:160px;object-fit:contain" alt="Playa+"></div>
      <div style="text-align:center;padding:0 24px">
        <div style="color:#fff;font-size:23px;font-weight:700;line-height:1.25">Stay on the sand.</div>
        <div style="color:rgba(255,255,255,0.72);font-size:14px;margin-top:8px;line-height:1.5">
          Drinks, ice cream, food & snacks<br>delivered right to your spot.
        </div>
      </div>
    </div>
    <div style="padding:16px;margin-top:-18px">
      <div class="card" style="border-radius:16px">
        <div class="section-label">How it works</div>
        ${[['🛒','Browse our menu'],['📍','Pin your spot at checkout'],['💳','Pay in seconds'],['🏃','We run it to you']].map((s,i,a)=>`
          <div style="display:flex;align-items:center;gap:12px;padding:10px 0;${i<a.length-1?'border-bottom:0.5px solid var(--border)':''}">
            <span style="font-size:20px;width:30px;text-align:center">${s[0]}</span>
            <span style="font-size:14px;color:var(--navy)">${s[1]}</span>
          </div>`).join('')}
      </div>
      <button class="btn-primary" onclick="nav('menu')">Order now →</button>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px">
        ${[['⏱️','~8 min delivery'],['🆓','Free delivery'],['🏖️','Beach-side only']].map(([e,l])=>`
          <div class="card" style="text-align:center;padding:12px 8px;margin-bottom:0">
            <div style="font-size:22px">${e}</div>
            <div style="font-size:10px;color:var(--muted);margin-top:4px">${l}</div>
          </div>`).join('')}
      </div>
    </div>
  </div>
  ${bottomNav('home')}`;
}

function screenMenu() {
  const cats = ['All', ...CAT_ORDER.filter(c => PRODUCTS.some(p=>p.cat===c))];
  const filtered = S.catFilter==='All' ? PRODUCTS : PRODUCTS.filter(p=>p.cat===S.catFilter);
  return `${brandHeader(true)}
  <div style="position:sticky;top:56px;z-index:40;background:var(--cream);border-bottom:0.5px solid var(--border);padding:7px 14px 7px">
    <div style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch">
      ${cats.map(c=>`<button onclick="setFilter('${c}')"
        style="white-space:nowrap;padding:5px 13px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;font-family:inherit;transition:all 0.15s;flex-shrink:0;
        border:1.5px solid ${S.catFilter===c?'#0d2b4e':'rgba(0,0,0,0.1)'};
        background:${S.catFilter===c?'#0d2b4e':'#fff'};
        color:${S.catFilter===c?'#fff':'#0d2b4e'}">
        ${CAT_EMOJI[c]||'🏖️'} ${c}
      </button>`).join('')}
    </div>
  </div>
  <div class="content fade-in">
    <div style="padding:10px 14px">
      ${filtered.map(p=>`
        <div class="card" style="margin-bottom:9px;display:flex;align-items:center;gap:12px;padding:12px">
          <div style="width:54px;height:54px;border-radius:10px;background:var(--sand);display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0;overflow:hidden;position:relative">
            ${p.img
              ? `<img src="${p.img}" style="width:54px;height:54px;object-fit:cover;border-radius:10px;${isOutOfStock(p)?'opacity:0.4;filter:grayscale(1)':''}" onerror="this.parentNode.innerHTML='${p.emoji}'">`
              : `<span style="${isOutOfStock(p)?'opacity:0.4;filter:grayscale(1)':''}">${p.emoji}</span>`}
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:13px;color:var(--navy);line-height:1.3">${p.name}</div>
            <div style="font-size:11px;color:var(--muted);margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px">${p.desc}</div>
            <div style="font-weight:700;color:var(--teal);font-size:15px">$${p.price.toFixed(2)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:7px;flex-shrink:0">
            ${isOutOfStock(p)
              ? `<span style="font-size:10px;font-weight:700;color:#fff;background:#e53e3e;padding:4px 8px;border-radius:20px;letter-spacing:0.5px;white-space:nowrap">OUT OF STOCK</span>`
              : `${inCart(p.sku)>0 ? `
                  <button onclick="removeItem('${p.sku}')"
                    style="width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:16px;color:var(--navy);font-family:inherit">−</button>
                  <span style="font-weight:700;min-width:18px;text-align:center;font-size:14px">${inCart(p.sku)}</span>
                ` : ''}
                ${stockLeft(p) <= 3 && stockLeft(p) > 0
                  ? `<div style="position:relative;display:inline-block">
                      <button onclick="addItem('${p.sku}')"
                        style="width:28px;height:28px;border-radius:50%;border:none;background:var(--orange);color:#fff;cursor:pointer;font-size:18px;line-height:1;font-family:inherit">+</button>
                      <span style="position:absolute;top:-6px;right:-8px;background:#f59e0b;color:#fff;font-size:9px;font-weight:700;padding:1px 4px;border-radius:8px;white-space:nowrap">${stockLeft(p)} left</span>
                    </div>`
                  : `<button onclick="addItem('${p.sku}')"
                      style="width:28px;height:28px;border-radius:50%;border:none;background:var(--orange);color:#fff;cursor:pointer;font-size:18px;line-height:1;font-family:inherit">+</button>`
                }`
            }
          </div>
        </div>`).join('')}
    </div>
    ${cartCount()>0 ? `
      <div style="padding:8px 14px 16px">

// Generate a random 4-digit passcode
function generatePasscode() {
  return String(Math.floor(1000 + Math.random() * 9000));
}

// GPS — request browser geolocation
function getGPS() {
  const status = document.getElementById('gps-status');
  if (!status) return;
  status.innerHTML = `<div style="text-align:center;padding:20px 0">
    <div class="spinner" style="margin:0 auto 12px"></div>
    <div style="font-size:13px;color:var(--muted)">Getting your location…</div>
  </div>`;

  if (!navigator.geolocation) {
    showGPSError('Geolocation is not supported by your browser.');
    return;
  }

  navigator.geolocation.getCurrentPosition(
    pos => {
      S.gpsLat = pos.coords.latitude;
      S.gpsLng = pos.coords.longitude;
      S.gpsAcc = Math.round(pos.coords.accuracy);
      S.pinPlaced = true;

      // Show success state
      status.innerHTML = `
        <div style="display:flex;align-items:center;gap:12px;padding:6px 0">
          <div style="width:40px;height:40px;border-radius:50%;background:#e6f7f5;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">✅</div>
          <div>
            <div style="font-weight:600;font-size:14px;color:var(--navy)">Location captured!</div>
            <div style="font-size:12px;color:var(--muted);margin-top:2px">Accuracy: ±${S.gpsAcc}m · ${S.gpsLat.toFixed(5)}, ${S.gpsLng.toFixed(5)}</div>
          </div>
          <button onclick="getGPS()" style="background:none;border:none;color:var(--teal);font-size:12px;cursor:pointer;font-family:inherit;font-weight:600;margin-left:auto;white-space:nowrap">↩ Redo</button>
        </div>`;

      // Reveal step 2 and below
      document.getElementById('id-card').style.display = 'block';
      document.getElementById('id-card').scrollIntoView({behavior:'smooth', block:'start'});
      checkReadyToOrder();
    },
    err => {
      let msg = 'Could not get your location.';
      if (err.code === 1) msg = 'Location access denied. Please allow access in your browser settings and try again.';
      if (err.code === 3) msg = 'Location request timed out. Please try again.';
      showGPSError(msg);
    },
    { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
  );
}

function showGPSError(msg) {
  const status = document.getElementById('gps-status');
  if (!status) return;
  status.innerHTML = `
    <div style="text-align:center;padding:12px 0">
      <div style="font-size:32px;margin-bottom:8px">😕</div>
      <div style="font-size:13px;color:#e53e3e;margin-bottom:12px;line-height:1.5">${msg}</div>
      <button onclick="getGPS()" class="btn-primary" style="max-width:200px;padding:11px;font-size:14px">Try again</button>
    </div>`;
}

// Switch between selfie / description tabs
function switchIdTab(tab) {
  const isSelfie = tab === 'selfie';
  document.getElementById('tab-selfie').style.background = isSelfie ? 'var(--navy)' : '#fff';
  document.getElementById('tab-selfie').style.color     = isSelfie ? '#fff' : 'var(--muted)';
  document.getElementById('tab-desc').style.background  = isSelfie ? '#fff' : 'var(--navy)';
  document.getElementById('tab-desc').style.color       = isSelfie ? 'var(--muted)' : '#fff';
  document.getElementById('panel-selfie').style.display = isSelfie ? 'block' : 'none';
  document.getElementById('panel-desc').style.display   = isSelfie ? 'none' : 'block';
  S.idMethod = tab;

    const ta = document.getElementById('spot-desc');
    if (ta) S.spotNote = ta.value;
  }

// Camera / selfie logic
let _stream = null;
function startCamera() {
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false })
    .then(stream => {
      _stream = stream;
      const video = document.getElementById('selfie-video');
      const start = document.getElementById('selfie-start');
      const btnCamera = document.getElementById('btn-camera');
      const btnSnap   = document.getElementById('btn-snap');
      video.srcObject = stream;
      video.play();
      video.style.display = 'block';
      start.style.display = 'none';
      btnCamera.style.display = 'none';
      btnSnap.style.display = 'inline-block';
    })
    .catch(() => {
      // Camera denied — switch to description
      switchIdTab('desc');
      alert('Camera access denied. Please describe your location instead.');
    });
}

function snapSelfie() {
  const video  = document.getElementById('selfie-video');
  const canvas = document.getElementById('selfie-canvas');
  const img    = document.getElementById('selfie-img');
  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
  S.selfieData = dataUrl;

  // Stop camera stream
  if (_stream) _stream.getTracks().forEach(t => t.stop());
  _stream = null;

  img.src = dataUrl;
  document.getElementById('selfie-preview').style.display = 'block';
  document.getElementById('selfie-capture').style.display = 'none';

  // Reveal summary + payment
  document.getElementById('summary-card').style.display = 'block';
  document.getElementById('pay-card').style.display = 'block';
  checkReadyToOrder();
}

function retakeSelfie() {
  S.selfieData = null;
  document.getElementById('selfie-preview').style.display = 'none';
  document.getElementById('selfie-capture').style.display = 'block';
  document.getElementById('selfie-start').style.display = 'block';
  document.getElementById('selfie-video').style.display = 'none';
  document.getElementById('btn-camera').style.display = 'inline-block';
  document.getElementById('btn-snap').style.display = 'none';
  checkReadyToOrder();
}

// Check if all required info is present to enable Pay button
function checkReadyToOrder() {
  const btn = document.getElementById('place-btn');
  const lbl = document.getElementById('btn-label');
  if (!btn) return;

  const hasGPS     = S.pinPlaced;
  const hasSelfie  = !!S.selfieData;
  // Always read live textarea value as fallback in case oninput missed
  const liveDesc = document.getElementById('spot-desc')?.value || '';
  if (liveDesc) S.spotNote = liveDesc;
  const hasDesc    = (S.spotNote||liveDesc).trim().length > 0;
  const method     = S.idMethod || 'selfie';
  const hasId      = method === 'selfie' ? hasSelfie : hasDesc;

  if (!hasGPS) {
    btn.disabled = true; btn.style.opacity = '0.4';
    lbl.textContent = 'Complete your location first';
  } else if (!hasId) {
    btn.disabled = true; btn.style.opacity = '0.4';
    lbl.textContent = method === 'selfie' ? 'Take a selfie to continue' : 'Add a description to continue';
    // Show summary + pay cards now that GPS is done
    document.getElementById('summary-card').style.display = 'block';
    document.getElementById('pay-card').style.display = 'block';
  } else {
    btn.disabled = false; btn.style.opacity = '1';
    lbl.textContent = `Pay $${cartTotal().toFixed(2)} securely →`;
  }
}

async function placeOrder() {
  if (!S.pinPlaced) return;

  // Generate delivery passcode
  const passcode = generatePasscode();

  const note = S.spotNote || document.getElementById('spot-desc')?.value || '';
  const items = Object.entries(S.cart).filter(([,q])=>q>0).map(([sku,qty])=>{
    const p = PRODUCTS.find(x=>x.sku===sku);
    return { name:p.name, emoji:p.emoji, desc:p.desc||'', qty, price:p.price };
  });

  const btn = document.getElementById('place-btn');
  const lbl = document.getElementById('btn-label');
  if (btn) btn.disabled = true;
  if (lbl) lbl.innerHTML = '⏳ Redirecting to payment…';

    note,
    passcode,
    gpsLat: S.gpsLat,
    gpsLng: S.gpsLng,
    gpsAcc: S.gpsAcc,
    selfie: S.selfieData || null,
    idMethod: S.idMethod || 'selfie',
  };
  localStorage.setItem('playa_pending_order', JSON.stringify(pendingOrder));

  try {
    const response = await fetch('/api/checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        items,
        spotNote: note,
        gpsLat: S.gpsLat,
        gpsLng: S.gpsLng,
        gpsAcc: S.gpsAcc,
        passcode,
        service_fee: CONFIG.service_fee,
        fee_label: CONFIG.fee_label,
        delivery_fee: CONFIG.delivery_fee,
        delivery_label: CONFIG.delivery_label,
      }),
    });
    const data = await response.json();
    if (data.url) {
      window.location.href = data.url;
    } else {
      throw new Error(data.error || 'Payment failed');

    console.error('Checkout error:', err);
    alert('Something went wrong. Please try again.');
    if (btn) btn.disabled = false;
    if (lbl) lbl.innerHTML = `Pay $${cartTotal().toFixed(2)} securely →`;
  }
}

      <div style="font-size:12px;color:rgba(255,255,255,0.6);margin-top:8px;line-height:1.5">
        Share this code with your Playa+ delivery person<br>to confirm your order. Do not share with others.
      </div>
    </div>` : ''}

    ${o ? `
    <div style="background:#fff;border:0.5px solid var(--border);border-radius:14px;padding:16px;width:100%;max-width:320px;margin-bottom:16px;text-align:left">
      <div style="font-size:11px;font-weight:600;color:var(--teal);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px">Order #${o.id}</div>
      ${o.items.map(it=>`<div style="font-size:13px;color:var(--muted);padding:3px 0">${it.emoji} ${it.name} ×${it.qty}</div>`).join('')}
      <div style="border-top:0.5px solid var(--border);margin-top:10px;padding-top:8px">
        ${o.subtotal!=null ? `<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:3px"><span>Subtotal</span><span>$${Number(o.subtotal).toFixed(2)}</span></div>` : ''}
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:3px"><span>${o.delivery_label||'Delivery'}</span><span>${o.delivery_fee>0?`$${Number(o.delivery_fee).toFixed(2)}`:'Free 🎉'}</span></div>
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px"><span>${o.fee_label||'Service fee'}</span><span>${o.service_fee>0?`$${Number(o.service_fee).toFixed(2)}`:'Free 🎉'}</span></div>
        <div style="display:flex;justify-content:space-between;font-weight:700;font-size:15px;color:var(--navy)"><span>Total paid</span><span>$${Number(o.total).toFixed(2)}</span></div>
      </div>
      ${o.note ? `<div style="margin-top:8px;font-size:12px;background:#e6f7f5;padding:6px 10px;border-radius:8px;color:#0d6e63">📍 ${o.note}</div>` : ''}
      ${o.gpsLat ? `<div style="margin-top:6px;font-size:11px;color:var(--muted)">📡 GPS: ${o.gpsLat.toFixed(5)}, ${o.gpsLng.toFixed(5)} ±${o.gpsAcc}m</div>` : ''}
    </div>` : ''}

    <button class="btn-primary" style="max-width:280px" onclick="nav('track')">Track my order →</button>
    <button onclick="nav('home')" style="margin-top:12px;background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit">Back to home</button>
  </div>`;
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  const screens = {
    loading:  screenLoading,
    standby:  screenStandby,
    error:    screenError,
    home:     screenHome,
    menu:     screenMenu,
    cart:     screenCart,
    checkout: screenCheckout,
    track:    screenTrack,
    profile:  screenProfile,
    history:  screenHistory,
    support:     screenSupport,
    suggestions: screenSuggestions,
    success:     screenSuccess,
  };
  app.innerHTML = (screens[S.view] || screenHome)();
  if (S.view==='checkout') bindCheckout();
  window.scrollTo(0,0);
}

function bindCheckout() {
  const map = document.getElementById('bmap');
  if (map) {
    map.addEventListener('click', e => {
      const r=map.getBoundingClientRect();
      S.pinX=((e.clientX-r.left)/r.width)*100;
      S.pinY=((e.clientY-r.top)/r.height)*100;
      S.pinPlaced=true; render(); bindCheckout();
    });
  }
  const sn = document.getElementById('spot-note');
  if (sn) sn.addEventListener('input', e=>{ S.spotNote=e.target.value; });
}

// ─── INVENTORY REFRESH ──────────────────────────────────────────────────────
// Silently re-fetches the sheet every 3 minutes so inventory stays current
// without the customer needing to manually refresh the page.
async function refreshInventory() {
  try {
    // Also re-check Config sheet for store_status changes
    try {
      const cr = await fetch(CONFIG_CSV + '&t=' + Date.now());
      const ct = await cr.text();
      const crows = parseCSV(ct);
      crows.forEach(row => {
        const key = (row['Key']||'').trim().toLowerCase();
        const val = (row['Value']||'').trim();
        if (key === 'store_status') {
          const wasOpen = CONFIG.store_status === 'open';
          CONFIG.store_status = val.toLowerCase();
          const isOpen = CONFIG.store_status === 'open';
          // If status changed, re-render immediately
          if (wasOpen !== isOpen) {
            if (!isOpen) { S.view = 'standby'; render(); }
            else { S.view = 'home'; render(); }
          }
        }
        if (key === 'store_message') CONFIG.store_message = val || CONFIG.store_message;
      });
    } catch(e) { /* fail silently */ }

    const r = await fetch(SHEET_CSV + '&t=' + Date.now()); // bust cache
    const text = await r.text();
    const rows = parseCSV(text);
    let changed = false;
    rows.forEach(row => {
      const sku = row['SKU'];
      const p = PRODUCTS.find(x=>x.sku===sku);
      if (!p) return;
      const newInv = parseInt(row['Inventory'] || row['inventory'] || '999', 10);
      const active = (row['Active']||'').trim().toLowerCase();
      const isActive = active==='yes' || active==='active';
      if (p.inventory !== newInv || p._active !== isActive) {
        p.inventory = newInv;
        p._active = isActive;
        changed = true;
      }
    });
    // Remove newly inactive products
    const before = PRODUCTS.length;
    PRODUCTS = PRODUCTS.filter(p => p._active !== false);
    if (PRODUCTS.length !== before) changed = true;
    // Re-render menu quietly if something changed
    if (changed && (S.view==='menu' || S.view==='cart')) render();
  } catch(e) { /* fail silently */ }
}

// ─── BOOT ────────────────────────────────────────────────────────────────────
(function boot() {
  const params = new URLSearchParams(window.location.search);

  if (params.get('session_id')) {
    // ✅ Returning from successful Stripe payment
    const pending = localStorage.getItem('playa_pending_order');
    if (pending) {
      const o = JSON.parse(pending);
      o.stripeSessionId = params.get('session_id');
      S.orders.push(o);
      save();
      S.orderPlaced = o;
      localStorage.removeItem('playa_pending_order');
      localStorage.removeItem(CART_KEY);
      localStorage.removeItem(VIEW_KEY);
      S.pinPlaced=false; S.gpsLat=null; S.gpsLng=null; S.gpsAcc=null;
      S.selfieData=null; S.spotNote=''; S.idMethod='selfie';
      // Save order to Supabase so operators can see it (fire and forget)
      fetch('/api/order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ order: o })
      }).catch(e => console.warn('Order sync failed:', e));
    }
    S.view = 'success';
    localStorage.setItem(VIEW_KEY, 'success');
    window.history.replaceState({}, '', '/');

  } else if (params.get('cancelled')) {
    // ❌ Customer cancelled on Stripe — go back to checkout
    S.view = 'checkout';
    window.history.replaceState({}, '', '/');
  }

  render();       // show loading or success screen immediately
  loadProducts(); // fetch from Google Sheets
  // Refresh inventory every 3 minutes silently
  setInterval(refreshInventory, 3 * 60 * 1000);
})();
</script>
