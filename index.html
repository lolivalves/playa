<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d2b4e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Playa+" />
  <meta name="description" content="Beach delivery – drinks, ice cream & snacks delivered to your spot." />
  <title>Playa+ | We Bring It To You</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:   #0d2b4e;
      --teal:   #2ab5a5;
      --teal2:  #3ecfbf;
      --orange: #f47c3c;
      --sun:    #f5a623;
      --sand:   #f5ede0;
      --cream:  #faf6f1;
      --white:  #ffffff;
      --border: rgba(0,0,0,0.09);
      --muted:  #718096;
      --green:  #22c55e;
    }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #e8e8e8;
      color: var(--navy);
      -webkit-font-smoothing: antialiased;
    }
    #app {
      max-width: 430px;
      min-height: 100dvh;
      margin: 0 auto;
      background: var(--cream);
      position: relative;
      overflow-x: hidden;
      box-shadow: 0 0 40px rgba(0,0,0,0.15);
    }
    button { font-family: inherit; }
    input, textarea { font-family: inherit; outline: none; }
    input:focus, textarea:focus { border-color: var(--teal) !important; }
    ::-webkit-scrollbar { width: 0; }
    .screen { min-height: 100dvh; display: flex; flex-direction: column; }
    .content { flex: 1; overflow-y: auto; padding-bottom: 80px; }
    .sticky-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      background: var(--white);
      border-top: 0.5px solid var(--border);
      display: flex;
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-btn {
      flex: 1; padding: 8px 4px 6px; border: none; background: transparent;
      cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
      transition: background 0.15s;
    }
    .nav-btn.active { background: #f0faf9; }
    .nav-btn span.icon { font-size: 20px; }
    .nav-btn span.label { font-size: 10px; font-weight: 400; color: var(--muted); }
    .nav-btn.active span.label { color: var(--teal); font-weight: 600; }
    .header {
      background: var(--navy);
      padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .card {
      background: var(--white);
      border: 0.5px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .section-label {
      font-size: 11px; font-weight: 600; color: var(--teal);
      letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 10px;
    }
    .btn-primary {
      width: 100%; padding: 15px;
      background: var(--orange); color: var(--white);
      border: none; border-radius: 12px;
      font-size: 16px; font-weight: 600; cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-primary:active { opacity: 0.85; }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
    .badge {
      font-size: 11px; font-weight: 600; padding: 3px 10px;
      border-radius: 20px;
    }
    .badge-preparing { background: #fff8e6; color: #b45309; }
    .badge-delivered { background: #e6f7f5; color: #0d6e63; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 36px; height: 36px; border: 3px solid rgba(42,181,165,0.2);
      border-top-color: var(--teal); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    .fade-in { animation: fadeIn 0.25s ease both; }
  </style>
</head>
<body>
<div id="app"></div>

<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
const SHEET_CSV  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ5bYbVSWwewbH3NJwwXuN4uplRqtQuwdc0bD0QbVvf6_iU6sj6gEzLJ3qO3vXVuir0x2hpFDyY5WGY/pub?gid=0&single=true&output=csv';
const CONFIG_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ5bYbVSWwewbH3NJwwXuN4uplRqtQuwdc0bD0QbVvf6_iU6sj6gEzLJ3qO3vXVuir0x2hpFDyY5WGY/pub?gid=611850101&single=true&output=csv';
const ORDERS_KEY = 'playa_orders_v1';

// Live config values (loaded from Config sheet)
let CONFIG = { service_fee: 4.99, fee_label: 'Service fee' };

// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const CAT_EMOJI   = { Drinks:'💧', Snacks:'🥨', Food:'🥗', 'Ice Cream':'🍦' };
const CAT_ORDER   = ['Drinks','Food','Snacks','Ice Cream'];
const PROD_EMOJI  = {
  DRK001:'🥤',DRK002:'🥤',DRK003:'🥤',DRK004:'🟢',DRK005:'🟢',
  DRK006:'💧',DRK007:'✨',DRK008:'⚡',DRK009:'🍊',DRK010:'🍋',
  SNK001:'🥔',SNK002:'🌽',SNK003:'💪',SNK004:'🌾',SNK005:'🧀',
  FD001:'🥗',FD002:'🐟',FD003:'🍤',
  ICE001:'🍓',ICE002:'🍉',ICE003:'💚',ICE004:'🥥',ICE005:'🍍',ICE006:'🍊'
};

// ─── STATE ───────────────────────────────────────────────────────────────────
const CART_KEY = 'playa_cart_v1';
const VIEW_KEY  = 'playa_view_v1';
const SAFE_VIEWS = ['home','menu','cart','track','profile','history','support'];

let PRODUCTS = [];
let S = {
  view: 'loading',
  cart: JSON.parse(localStorage.getItem(CART_KEY) || '{}'),
  orders: JSON.parse(localStorage.getItem(ORDERS_KEY) || '[]'),
  catFilter: 'All',
  pinPlaced: false, pinX: 55, pinY: 65,
  spotNote: '',
  orderPlaced: null,
  adminView: 'dashboard',
  supportSent: false,
  supportMsg: ''
};
function save() { localStorage.setItem(ORDERS_KEY, JSON.stringify(S.orders)); }
function saveCart() {
  localStorage.setItem(CART_KEY, JSON.stringify(S.cart));
  if (SAFE_VIEWS.includes(S.view)) localStorage.setItem(VIEW_KEY, S.view);
}
function cartCount() { return Object.values(S.cart).reduce((a,b)=>a+b,0); }
function inCart(sku) { return S.cart[sku] || 0; }
function stockLeft(p) { return (p.inventory ?? 999) - inCart(p.sku); }
function isOutOfStock(p) { return stockLeft(p) <= 0; }
function cartSubtotal() {
  return Object.entries(S.cart).reduce((sum,[sku,qty]) => {
    const p = PRODUCTS.find(x=>x.sku===sku);
    return sum + (p ? p.price*qty : 0);
  }, 0);
}
function cartTotal() {
  // grandTotal = subtotal + service fee (when cart has items)
  const sub = cartSubtotal();
  return sub > 0 ? sub + (CONFIG.service_fee || 0) : 0;
}

// ─── CSV PARSER ──────────────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
  return lines.slice(1).map(line => {
    const cols=[]; let cur='', inQ=false;
    for (let c of line) {
      if (c==='"') { inQ=!inQ; }
      else if (c===',' && !inQ) { cols.push(cur); cur=''; }
      else cur+=c;
    }
    cols.push(cur);
    const obj={};
    headers.forEach((h,i)=>{ obj[h]=(cols[i]||'').trim().replace(/^"|"$/g,''); });
    return obj;
  });
}

async function loadConfig() {
  try {
    const r = await fetch(CONFIG_CSV);
    const text = await r.text();
    const rows = parseCSV(text);
    rows.forEach(row => {
      const key = (row['Key'] || '').trim().toLowerCase();
      const val = (row['Value'] || '').trim();
      if (key === 'service_fee') CONFIG.service_fee = parseFloat(val) || 0;
      if (key === 'fee_label')   CONFIG.fee_label   = val || 'Service fee';
    });
  } catch(e) {
    console.warn('Config sheet unavailable, using defaults.');
  }
}

async function loadProducts() {
  try {
    await loadConfig(); // load fee before rendering anything
    const r = await fetch(SHEET_CSV);
    const text = await r.text();
    const rows = parseCSV(text);
    PRODUCTS = rows
      .filter(r => {
        const active = (r['Active'] || '').trim().toLowerCase();
        return active === 'yes' || active === 'active';
      })
      .map(r => ({
        sku:       r['SKU'],
        name:      r['Product Name'],
        desc:      r['Description'],
        cat:       r['Category'],
        img:       r['Product Image URL'] || '',
        price:     parseFloat(r['Selling Price ($)']) || 0,
        emoji:     PROD_EMOJI[r['SKU']] || CAT_EMOJI[r['Category']] || '🏖️',
        inventory: parseInt(r['Inventory'] || r['inventory'] || '999', 10),
      }));
    // Restore last view the user was on (cart, menu, etc.)
    const savedView = localStorage.getItem(VIEW_KEY);
    S.view = (savedView && SAFE_VIEWS.includes(savedView)) ? savedView : 'home';
  } catch(e) {
    S.view = 'error';
  }
  render();
}

// ─── SVG ASSETS ──────────────────────────────────────────────────────────────
function towerSVG(s=60) {
  return `<svg width="${s}" height="${s}" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <circle cx="42" cy="46" r="34" fill="#f5a623"/>
    <path d="M10 80 Q30 68 50 72 Q70 76 100 68 Q115 82 120 90 L0 90Z" fill="#2ab5a5" opacity="0.7"/>
    <path d="M0 84 Q25 74 55 78 Q80 82 120 74 L120 95 L0 95Z" fill="#3ecfbf" opacity="0.5"/>
    <rect x="46" y="32" width="32" height="24" rx="2" fill="#0d2b4e"/>
    <rect x="50" y="36" width="8" height="8" rx="1" fill="#fff" opacity="0.9"/>
    <rect x="62" y="36" width="8" height="8" rx="1" fill="#fff" opacity="0.9"/>
    <rect x="44" y="54" width="36" height="3" rx="1" fill="#0d2b4e"/>
    <rect x="42" y="56" width="4" height="22" rx="1" fill="#0d2b4e"/>
    <rect x="74" y="56" width="4" height="22" rx="1" fill="#0d2b4e"/>
    <line x1="46" y1="58" x2="60" y2="78" stroke="#0d2b4e" stroke-width="2"/>
    <line x1="74" y1="58" x2="60" y2="78" stroke="#0d2b4e" stroke-width="2"/>
    <line x1="46" y1="68" x2="74" y2="68" stroke="#0d2b4e" stroke-width="1.5"/>
    <rect x="57" y="20" width="2" height="12" rx="1" fill="#0d2b4e"/>
    <path d="M59 21 L67 24 L59 28Z" fill="#0d2b4e"/>
    <ellipse cx="25" cy="86" rx="18" ry="5" fill="#e8d5b7" opacity="0.6"/>
    <ellipse cx="90" cy="82" rx="14" ry="4" fill="#e8d5b7" opacity="0.5"/>
  </svg>`;
}

// ─── SHARED COMPONENTS ───────────────────────────────────────────────────────
function brandHeader(showCart=false) {
  return `<div class="header">
    <div style="display:flex;align-items:center;gap:10px">
      ${towerSVG(38)}
      <div>
        <span style="color:#fff;font-size:19px;font-weight:700;letter-spacing:-0.5px">playa</span>
        <span style="color:#f47c3c;font-size:19px;font-weight:700">+</span>
        <div style="color:#3ecfbf;font-size:9px;letter-spacing:2.5px;text-transform:uppercase;margin-top:-2px">we bring it to you</div>
      </div>
    </div>
    ${showCart ? `<button onclick="nav('cart')" style="background:rgba(255,255,255,0.15);border:none;border-radius:20px;padding:7px 14px;color:#fff;cursor:pointer;font-size:13px;font-family:inherit">
      ${cartCount()>0 ? `🛒 ${cartCount()} · $${cartTotal().toFixed(2)}` : '🛒 Cart'}
    </button>` : ''}
  </div>`;
}

function backHeader(title, backTo) {
  return `<div class="header">
    <div style="display:flex;align-items:center;gap:8px">
      <button onclick="nav('${backTo}')" style="background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:0 6px 0 0;line-height:1">←</button>
      <span style="color:#fff;font-size:16px;font-weight:500">${title}</span>
    </div>
  </div>`;
}

function bottomNav(active) {
  const tabs = [
    {id:'home', icon:'🏠', label:'Home'},
    {id:'menu', icon:'🍽️', label:'Menu'},
    {id:'track', icon:'🚀', label:'Track'},
    {id:'profile', icon:'👤', label:'Profile'}
  ];
  return `<nav class="sticky-nav">
    ${tabs.map(t=>`
      <button class="nav-btn ${active===t.id?'active':''}" onclick="nav('${t.id}')">
        <span class="icon">${t.icon}</span>
        <span class="label">${t.label}</span>
      </button>
    `).join('')}
  </nav>`;
}

// ─── SCREENS ─────────────────────────────────────────────────────────────────
function screenLoading() {
  return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;gap:20px">
    ${towerSVG(90)}
    <div style="font-size:22px;font-weight:700;color:#0d2b4e">playa<span style="color:#f47c3c">+</span></div>
    <div class="spinner"></div>
    <div style="color:#718096;font-size:13px">Loading your beach menu…</div>
  </div>`;
}

function screenError() {
  return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;gap:14px;padding:24px;text-align:center">
    <div style="font-size:48px">😕</div>
    <div style="font-weight:700;font-size:18px">Couldn't load the menu</div>
    <div style="color:#718096;font-size:14px">Check your connection and try again.</div>
    <button class="btn-primary" style="max-width:200px" onclick="location.reload()">Retry</button>
  </div>`;
}

function screenHome() {
  return `${brandHeader()}
  <div class="content fade-in">
    <div style="background:#0d2b4e;padding:8px 0 32px">
      <div style="display:flex;justify-content:center;padding:16px 0 8px">${towerSVG(120)}</div>
      <div style="text-align:center;padding:0 24px">
        <div style="color:#fff;font-size:23px;font-weight:700;line-height:1.25">Stay on the sand.</div>
        <div style="color:rgba(255,255,255,0.72);font-size:14px;margin-top:8px;line-height:1.5">
          Drinks, ice cream, food & snacks<br>delivered right to your spot.
        </div>
      </div>
    </div>
    <div style="padding:16px;margin-top:-18px">
      <div class="card" style="border-radius:16px">
        <div class="section-label">How it works</div>
        ${[['🛒','Browse our menu'],['📍','Pin your spot at checkout'],['💳','Pay in seconds'],['🏃','We run it to you']].map((s,i,a)=>`
          <div style="display:flex;align-items:center;gap:12px;padding:10px 0;${i<a.length-1?'border-bottom:0.5px solid var(--border)':''}">
            <span style="font-size:20px;width:30px;text-align:center">${s[0]}</span>
            <span style="font-size:14px;color:var(--navy)">${s[1]}</span>
          </div>`).join('')}
      </div>
      <button class="btn-primary" onclick="nav('menu')">Order now →</button>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px">
        ${[['⏱️','~8 min delivery'],['🆓','Free delivery'],['🏖️','Beach-side only']].map(([e,l])=>`
          <div class="card" style="text-align:center;padding:12px 8px;margin-bottom:0">
            <div style="font-size:22px">${e}</div>
            <div style="font-size:10px;color:var(--muted);margin-top:4px">${l}</div>
          </div>`).join('')}
      </div>
    </div>
  </div>
  ${bottomNav('home')}`;
}

function screenMenu() {
  const cats = ['All', ...CAT_ORDER.filter(c => PRODUCTS.some(p=>p.cat===c))];
  const filtered = S.catFilter==='All' ? PRODUCTS : PRODUCTS.filter(p=>p.cat===S.catFilter);
  return `${brandHeader(true)}
  <div style="position:sticky;top:56px;z-index:40;background:var(--cream);border-bottom:0.5px solid var(--border);padding:7px 14px 7px">
    <div style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch">
      ${cats.map(c=>`<button onclick="setFilter('${c}')"
        style="white-space:nowrap;padding:5px 13px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;font-family:inherit;transition:all 0.15s;flex-shrink:0;
        border:1.5px solid ${S.catFilter===c?'#0d2b4e':'rgba(0,0,0,0.1)'};
        background:${S.catFilter===c?'#0d2b4e':'#fff'};
        color:${S.catFilter===c?'#fff':'#0d2b4e'}">
        ${CAT_EMOJI[c]||'🏖️'} ${c}
      </button>`).join('')}
    </div>
  </div>
  <div class="content fade-in">
    <div style="padding:10px 14px">
      ${filtered.map(p=>`
        <div class="card" style="margin-bottom:9px;display:flex;align-items:center;gap:12px;padding:12px">
          <div style="width:54px;height:54px;border-radius:10px;background:var(--sand);display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0;overflow:hidden;position:relative">
            ${p.img
              ? `<img src="${p.img}" style="width:54px;height:54px;object-fit:cover;border-radius:10px;${isOutOfStock(p)?'opacity:0.4;filter:grayscale(1)':''}" onerror="this.parentNode.innerHTML='${p.emoji}'">`
              : `<span style="${isOutOfStock(p)?'opacity:0.4;filter:grayscale(1)':''}">${p.emoji}</span>`}
          </div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:600;font-size:13px;color:var(--navy);line-height:1.3">${p.name}</div>
            <div style="font-size:11px;color:var(--muted);margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:180px">${p.desc}</div>
            <div style="font-weight:700;color:var(--teal);font-size:15px">$${p.price.toFixed(2)}</div>
          </div>
          <div style="display:flex;align-items:center;gap:7px;flex-shrink:0">
            ${isOutOfStock(p)
              ? `<span style="font-size:10px;font-weight:700;color:#fff;background:#e53e3e;padding:4px 8px;border-radius:20px;letter-spacing:0.5px;white-space:nowrap">OUT OF STOCK</span>`
              : `${inCart(p.sku)>0 ? `
                  <button onclick="removeItem('${p.sku}')"
                    style="width:28px;height:28px;border-radius:50%;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:16px;color:var(--navy);font-family:inherit">−</button>
                  <span style="font-weight:700;min-width:18px;text-align:center;font-size:14px">${inCart(p.sku)}</span>
                ` : ''}
                ${stockLeft(p) <= 3 && stockLeft(p) > 0
                  ? `<div style="position:relative;display:inline-block">
                      <button onclick="addItem('${p.sku}')"
                        style="width:28px;height:28px;border-radius:50%;border:none;background:var(--orange);color:#fff;cursor:pointer;font-size:18px;line-height:1;font-family:inherit">+</button>
                      <span style="position:absolute;top:-6px;right:-8px;background:#f59e0b;color:#fff;font-size:9px;font-weight:700;padding:1px 4px;border-radius:8px;white-space:nowrap">${stockLeft(p)} left</span>
                    </div>`
                  : `<button onclick="addItem('${p.sku}')"
                      style="width:28px;height:28px;border-radius:50%;border:none;background:var(--orange);color:#fff;cursor:pointer;font-size:18px;line-height:1;font-family:inherit">+</button>`
                }`
            }
          </div>
        </div>`).join('')}
    </div>
    ${cartCount()>0 ? `
      <div style="position:sticky;bottom:72px;padding:0 14px 8px">
        <button class="btn-primary" onclick="nav('cart')" style="box-shadow:0 4px 18px rgba(244,124,60,0.45)">
          View cart · ${cartCount()} items · $${cartTotal().toFixed(2)}
        </button>
      </div>` : ''}
  </div>
  ${bottomNav('menu')}`;
}

function screenCart() {
  const items = Object.entries(S.cart).filter(([,q])=>q>0);
  return `${backHeader('Your cart','menu')}
  <div class="content fade-in" style="padding:14px">
    ${!items.length
      ? `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:12px;text-align:center">
          <div style="font-size:48px">🛒</div>
          <div style="font-weight:600;font-size:17px">Cart is empty</div>
          <div style="color:var(--muted);font-size:14px">Add some items from the menu</div>
          <button class="btn-primary" style="max-width:200px;margin-top:8px" onclick="nav('menu')">Browse menu</button>
        </div>`
      : `${items.map(([sku,qty])=>{
          const p=PRODUCTS.find(x=>x.sku===sku); if(!p) return '';
          return `<div class="card" style="display:flex;align-items:center;gap:12px;padding:13px;margin-bottom:9px">
            <div style="width:50px;height:50px;border-radius:9px;background:var(--sand);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;overflow:hidden">
              ${p.img
                ? `<img src="${p.img}" style="width:50px;height:50px;object-fit:cover;border-radius:9px" onerror="this.parentNode.innerHTML='${p.emoji}'">`
                : p.emoji}
            </div>
            <div style="flex:1">
              <div style="font-weight:600;font-size:13px">${p.name}</div>

// ─── ACTIONS ─────────────────────────────────────────────────────────────────
function nav(v) {
  if (v==='admin') { S.view='admin'; renderAdmin(); return; }
  S.view=v; render();
}
function setFilter(f) { S.catFilter=f; render(); }
function setAdminView(v) { S.adminView=v; renderAdmin(); }
function addItem(sku) {
  const p = PRODUCTS.find(x=>x.sku===sku);
  if (!p) return;
  if (isOutOfStock(p)) return; // belt-and-suspenders guard
  S.cart[sku] = (S.cart[sku]||0) + 1;
  saveCart(); render();
}
function removeItem(sku) { if(S.cart[sku]>0) S.cart[sku]--; saveCart(); render(); }
function sendSupport() { S.supportMsg=document.getElementById('support-input')?.value||''; S.supportSent=true; render(); }
function markDone(id) {
  const o=S.orders.find(x=>x.id===id);
  if(o){ o.status='Delivered'; save(); renderAdmin(); }
}
async function placeOrder() {
  if (!S.pinPlaced) return;

  const note = document.getElementById('spot-note')?.value || S.spotNote;
  const items = Object.entries(S.cart).filter(([,q])=>q>0).map(([sku,qty])=>{
    const p = PRODUCTS.find(x=>x.sku===sku);
    return { name:p.name, emoji:p.emoji, desc:p.desc||'', qty, price:p.price };
  });

  // Show loading on button
  const btn = document.getElementById('place-btn');
  const lbl = document.getElementById('btn-label');
  if (btn) btn.disabled = true;
  if (lbl) lbl.innerHTML = '⏳ Redirecting to payment…';

  // Save pending order so we can confirm it after Stripe redirects back
  const pendingOrder = {
    id: 1000 + S.orders.length,
    date: new Date().toLocaleDateString(),
    status: 'Preparing',
    total: cartTotal(),
    subtotal: cartSubtotal(),
    service_fee: CONFIG.service_fee,
    fee_label: CONFIG.fee_label,
    items,
    note
  };
  localStorage.setItem('playa_pending_order', JSON.stringify(pendingOrder));

  try {
    const response = await fetch('/api/checkout', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ items, spotNote: note, pinX: S.pinX, pinY: S.pinY, service_fee: CONFIG.service_fee, fee_label: CONFIG.fee_label }),
    });
    const data = await response.json();
    if (data.url) {
      window.location.href = data.url; // → Stripe hosted checkout page
    } else {
      throw new Error(data.error || 'Payment failed');
    }
  } catch (err) {
    console.error('Checkout error:', err);
    alert('Something went wrong. Please try again.');
    if (btn) btn.disabled = false;
    if (lbl) lbl.innerHTML = `Pay $${cartTotal().toFixed(2)} securely →`;
  }
}

// ─── SUCCESS SCREEN (returned from Stripe) ───────────────────────────────────
function screenSuccess() {
  const o = S.orderPlaced;
  return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100dvh;padding:32px;text-align:center;background:var(--cream)">
    <div style="font-size:72px;margin-bottom:8px">🎉</div>
    <div style="font-size:24px;font-weight:800;color:var(--navy);margin-bottom:8px">Order confirmed!</div>
    <div style="font-size:14px;color:var(--muted);margin-bottom:28px;line-height:1.5">
      Payment received. Your order is being prepared<br>and will be at your spot shortly.
    </div>
    ${o ? `
    <div style="background:#fff;border:0.5px solid var(--border);border-radius:14px;padding:18px;width:100%;max-width:320px;margin-bottom:24px;text-align:left">
      <div style="font-size:11px;font-weight:600;color:var(--teal);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px">Your order #${o.id}</div>
      ${o.items.map(it=>`<div style="font-size:13px;color:var(--muted);padding:3px 0">${it.emoji} ${it.name} ×${it.qty}</div>`).join('')}
      <div style="border-top:0.5px solid var(--border);margin-top:10px;padding-top:8px">
        ${o.subtotal ? `<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:3px"><span>Subtotal</span><span>$${o.subtotal.toFixed(2)}</span></div>` : ''}
        ${o.service_fee > 0 ? `<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px"><span>${o.fee_label||'Service fee'}</span><span>$${o.service_fee.toFixed(2)}</span></div>` : ''}
        <div style="display:flex;justify-content:space-between;font-weight:700;font-size:15px;color:var(--navy)"><span>Total paid</span><span>$${o.total.toFixed(2)}</span></div>
      </div>
      ${o.note ? `<div style="margin-top:8px;font-size:12px;background:#e6f7f5;padding:6px 10px;border-radius:8px;color:#0d6e63">📍 ${o.note}</div>` : ''}
    </div>` : ''}
    <button class="btn-primary" style="max-width:280px" onclick="nav('track')">Track my order →</button>
    <button onclick="nav('home')" style="margin-top:12px;background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;font-family:inherit">Back to home</button>
  </div>`;
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  const screens = {
    loading:  screenLoading,
    error:    screenError,
    home:     screenHome,
    menu:     screenMenu,
    cart:     screenCart,
    checkout: screenCheckout,
    track:    screenTrack,
    profile:  screenProfile,
    history:  screenHistory,
    support:  screenSupport,
    success:  screenSuccess,
  };
  app.innerHTML = (screens[S.view] || screenHome)();
  if (S.view==='checkout') bindCheckout();
  window.scrollTo(0,0);
}

function bindCheckout() {
  const map = document.getElementById('bmap');
  if (map) {
    map.addEventListener('click', e => {
      const r=map.getBoundingClientRect();
      S.pinX=((e.clientX-r.left)/r.width)*100;
      S.pinY=((e.clientY-r.top)/r.height)*100;
      S.pinPlaced=true; render(); bindCheckout();
    });
  }
  const sn = document.getElementById('spot-note');
  if (sn) sn.addEventListener('input', e=>{ S.spotNote=e.target.value; });
}

// ─── INVENTORY REFRESH ──────────────────────────────────────────────────────
// Silently re-fetches the sheet every 3 minutes so inventory stays current
// without the customer needing to manually refresh the page.
async function refreshInventory() {
  try {
    const r = await fetch(SHEET_CSV + '&t=' + Date.now()); // bust cache
    const text = await r.text();
    const rows = parseCSV(text);
    let changed = false;
    rows.forEach(row => {
      const sku = row['SKU'];
      const p = PRODUCTS.find(x=>x.sku===sku);
      if (!p) return;
      const newInv = parseInt(row['Inventory'] || row['inventory'] || '999', 10);
      const active = (row['Active']||'').trim().toLowerCase();
      const isActive = active==='yes' || active==='active';
      if (p.inventory !== newInv || p._active !== isActive) {
        p.inventory = newInv;
        p._active = isActive;
        changed = true;
      }
    });
    // Remove newly inactive products
    const before = PRODUCTS.length;
    PRODUCTS = PRODUCTS.filter(p => p._active !== false);
    if (PRODUCTS.length !== before) changed = true;
    // Re-render menu quietly if something changed
    if (changed && (S.view==='menu' || S.view==='cart')) render();
  } catch(e) { /* fail silently */ }
}

// ─── BOOT ────────────────────────────────────────────────────────────────────
(function boot() {
  const params = new URLSearchParams(window.location.search);

  if (params.get('session_id')) {
    // ✅ Returning from successful Stripe payment
    const pending = localStorage.getItem('playa_pending_order');
    if (pending) {
      const o = JSON.parse(pending);
      S.orders.push(o);
      save();
      S.orderPlaced = o;
      localStorage.removeItem('playa_pending_order');
      localStorage.removeItem(CART_KEY);
      localStorage.removeItem(VIEW_KEY);
    }
    S.view = 'success';
    // Clean the URL so refreshing doesn't re-trigger this
    window.history.replaceState({}, '', '/');

  } else if (params.get('cancelled')) {
    // ❌ Customer cancelled on Stripe — go back to checkout
    S.view = 'checkout';
    window.history.replaceState({}, '', '/');
  }

  render();       // show loading or success screen immediately
  loadProducts(); // fetch from Google Sheets
  // Refresh inventory every 3 minutes silently
  setInterval(refreshInventory, 3 * 60 * 1000);
})();
</script>
